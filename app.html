
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA SIEM | Security Operations Center</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- NOVA SIEM STYLES -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">

            <h4 class="m-0 text-uppercase"
                style="color: var(--primary); letter-spacing: 1px;">

                <i class="bi bi-shield-shaded me-2"></i>
                NOVA SIEM

            </h4>

        </div>

        <nav class="sidebar-nav">

            <div class="sidebar-section-title" data-i18n="mainMenu">
                Menú principal
            </div>

            <a href="app.html?page=dashboard"
               class="nav-link"
               data-route="dashboard">

                <i class="bi bi-grid-1x2"></i>
                <span data-i18n="dashboard">Panel de control</span>

            </a>

            <a href="app.html?page=events"
               class="nav-link"
               data-route="events">

                <i class="bi bi-list-columns-reverse"></i>
                <span data-i18n="events">Gestión de eventos</span>

            </a>

            <a href="app.html?page=alerts"
               class="nav-link"
               data-route="alerts">

                <i class="bi bi-bell"></i>
                <span data-i18n="alerts">Alertas</span>

            </a>

            <a href="app.html?page=incidents"
               class="nav-link"
               data-route="incidents">

                <i class="bi bi-folder-exclamation"></i>
                <span data-i18n="incidents">Incidentes</span>

            </a>

            <a href="app.html?page=investigations"
               class="nav-link"
               data-route="investigations">

                <i class="bi bi-diagram-3"></i>
                <span data-i18n="investigations">Investigaciones</span>

            </a>

            <hr style="border-color: var(--bg-panel); margin: 1rem 1.5rem;">

            <div class="sidebar-section-title" data-i18n="security">
                Seguridad
            </div>

            <a href="app.html?page=detection"
               class="nav-link"
               data-route="detection">

                <i class="bi bi-shield-check"></i>
                <span data-i18n="detection">Reglas de detección</span>

            </a>

            <a href="app.html?page=reports"
               class="nav-link"
               data-route="reports">

                <i class="bi bi-file-earmark-bar-graph"></i>
                <span data-i18n="reports">Reportes</span>

            </a>

        </nav>

        <!-- SIDEBAR FOOTER -->
        <div class="sidebar-footer">

            <div class="sidebar-status">

                <span class="status-dot"></span>

                <span data-i18n="systemOnline">
                    Sistema operativo
                </span>

            </div>

        </div>

    </aside>


    <!-- MAIN PANEL -->
    <div class="main-panel">

        <!-- TOPBAR -->
        <header class="topbar">

            <!-- BREADCRUMB -->
            <div>

                <span class="text-muted" id="breadcrumb">

                    NOVA SIEM /

                    <span data-i18n="dashboard">
                        Panel de control
                    </span>

                </span>

            </div>


            <div class="d-flex align-items-center gap-3">

                <!-- LANGUAGE -->
                <div class="language-selector">

                    <i class="bi bi-translate"></i>

                    <select id="languageSelector"
                            class="language-select"
                            aria-label="Select language">

                        <option value="es">ES - Español</option>
                        <option value="en">EN - English</option>

                    </select>

                </div>


                <!-- USER PROFILE -->
                <div class="dropdown">

                    <button class="btn btn-sm d-flex align-items-center gap-2 border-0"
                            type="button"
                            id="userProfileDropdown"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            style="background: transparent; color: var(--text-main);">

                        <i class="bi bi-person-circle fs-4"
                           style="color: var(--text-muted);"></i>

                        <span id="user-name">
                            Santiago Garcia
                        </span>

                        <i class="bi bi-chevron-down small"></i>

                    </button>


                    <ul class="dropdown-menu dropdown-menu-end shadow">

                        <!-- PROFILE -->
                        <li>

                            <a class="dropdown-item"
                               href="#"
                               id="btnProfile">

                                <i class="bi bi-person me-2"></i>
                                Mi perfil

                            </a>

                        </li>


                        <li>
                            <hr class="dropdown-divider">
                        </li>


                        <!-- PROFILE LOGOUT -->
                        <li>

                            <button class="dropdown-item text-danger"
                                    type="button"
                                    id="btnProfileLogout">

                                <i class="bi bi-box-arrow-right me-2"></i>
                                Cerrar sesión

                            </button>

                        </li>

                    </ul>

                </div>


                <!-- QUICK LOGOUT -->
                <button class="btn btn-sm btn-outline-danger"
                        id="btnLogout"
                        type="button"
                        data-i18n-title="logout"
                        title="Cerrar sesión"
                        aria-label="Cerrar sesión">

                    <i class="bi bi-box-arrow-right"></i>

                </button>

            </div>

        </header>


        <!-- DYNAMIC CONTENT -->
        <main id="nova-content" class="p-4">

            <div class="d-flex justify-content-center align-items-center"
                 style="height: 100%;">

                <div class="spinner-border"
                     style="color: var(--primary);"
                     role="status">

                    <span class="visually-hidden" data-i18n="loading">
                        Cargando módulo...
                    </span>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- EXTERNAL LIBRARIES -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/lib/cytoscape/cytoscape.min.js"></script>


<!-- API -->
<script src="js/api/endpoints.js"></script>
<script src="js/api/httpClient.js"></script>


<!-- SHARED UTILITIES -->
<script src="js/utils/dom.js"></script>
<script src="js/utils/formatters.js"></script>


<!-- LANGUAGE -->
<script src="js/modules/language.js"></script>


<!-- ROUTER -->
<script src="js/utils/router.js"></script>
<script src="js/modules/auth.js"></script>

</body>

</html>
