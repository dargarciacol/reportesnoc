
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="NOVA SIEM - Plataforma de gestión de información y eventos de seguridad">

    <meta name="theme-color" content="#0B1120">

    <title>NOVA SIEM | Centro de Operaciones de Seguridad</title>

    <!-- BOOTSTRAP CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- BOOTSTRAP ICONS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- ESTILOS NOVA SIEM -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">

</head>

<body>

    <div class="wrapper">

        <!-- BARRA LATERAL -->
        <aside class="sidebar">

            <!-- ENCABEZADO -->
            <div class="sidebar-header">

                <h4 class="m-0 text-uppercase"
                    style="color: var(--primary); letter-spacing: 1px;">

                    <i class="bi bi-shield-shaded me-2"></i>
                    NOVA SIEM

                </h4>

            </div>

            <!-- NAVEGACIÓN -->
            <nav class="sidebar-nav" aria-label="Navegación principal">

                <div class="sidebar-section-title">
                    Menú principal
                </div>

                <a href="app.html?page=dashboard"
                   class="nav-link"
                   data-route="dashboard">

                    <i class="bi bi-grid-1x2"></i>
                    <span>Panel de control</span>

                </a>

                <a href="app.html?page=events"
                   class="nav-link"
                   data-route="events">

                    <i class="bi bi-list-columns-reverse"></i>
                    <span>Gestión de eventos</span>

                </a>

                <a href="app.html?page=alerts"
                   class="nav-link"
                   data-route="alerts">

                    <i class="bi bi-bell"></i>
                    <span>Alertas de seguridad</span>

                </a>

                <a href="app.html?page=incidents"
                   class="nav-link"
                   data-route="incidents">

                    <i class="bi bi-folder-exclamation"></i>
                    <span>Gestión de incidentes</span>

                </a>

                <a href="app.html?page=investigations"
                   class="nav-link"
                   data-route="investigations">

                    <i class="bi bi-diagram-3"></i>
                    <span>Investigaciones</span>

                </a>

                <hr style="border-color: var(--bg-panel); margin: 1rem 1.5rem;">

                <!-- SECCIÓN DE SEGURIDAD -->
                <div class="sidebar-section-title">
                    Seguridad
                </div>

                <a href="app.html?page=detection"
                   class="nav-link"
                   data-route="detection">

                    <i class="bi bi-shield-check"></i>
                    <span>Reglas de detección</span>

                </a>

                <a href="app.html?page=reports"
                   class="nav-link"
                   data-route="reports">

                    <i class="bi bi-file-earmark-bar-graph"></i>
                    <span>Informes y reportes</span>

                </a>

            </nav>

            <!-- PIE DE LA BARRA LATERAL -->
            <div class="sidebar-footer">

                <div class="sidebar-status">

                    <span class="status-dot"></span>

                    <span>Sistema operativo</span>

                </div>

            </div>

        </aside>

        <!-- PANEL PRINCIPAL -->
        <div class="main-panel">

            <!-- BARRA SUPERIOR -->
            <header class="topbar">

                <!-- RUTA DE NAVEGACIÓN -->
                <div>

                    <span class="text-muted" id="breadcrumb">

                        NOVA SIEM /

                        <span>Panel de control</span>

                    </span>

                </div>

                <div class="d-flex align-items-center gap-3">

                    <!-- IDIOMA -->
                    <div class="language-selector">

                        <i class="bi bi-translate"></i>

                        <select
                            id="languageSelector"
                            class="language-select"
                            aria-label="Idioma de la aplicación"
                        >

                            <option value="es" selected>ES - Español</option>

                        </select>

                    </div>

                    <!-- PERFIL DEL USUARIO -->
                    <div class="dropdown">

                        <button
                            class="btn btn-sm d-flex align-items-center gap-2 border-0"
                            type="button"
                            id="userProfileDropdown"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            style="background: transparent; color: var(--text-main);"
                        >

                            <i class="bi bi-person-circle fs-4"
                               style="color: var(--text-muted);"></i>

                            <span id="user-name">
                                Usuario
                            </span>

                            <i class="bi bi-chevron-down small"></i>

                        </button>

                        <ul class="dropdown-menu dropdown-menu-end shadow">

                            <li>

                                <a
                                    class="dropdown-item"
                                    href="#"
                                    id="btnProfile"
                                >

                                    <i class="bi bi-person me-2"></i>
                                    Mi perfil

                                </a>

                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li>

                                <button
                                    class="dropdown-item text-danger"
                                    type="button"
                                    id="btnProfileLogout"
                                >

                                    <i class="bi bi-box-arrow-right me-2"></i>
                                    Cerrar sesión

                                </button>

                            </li>

                        </ul>

                    </div>

                    <!-- CERRAR SESIÓN -->
                    <button
                        class="btn btn-sm btn-outline-danger"
                        id="btnLogout"
                        type="button"
                        title="Cerrar sesión"
                        aria-label="Cerrar sesión"
                    >

                        <i class="bi bi-box-arrow-right"></i>

                    </button>

                </div>

            </header>

            <!-- CONTENIDO DINÁMICO -->
            <main id="nova-content" class="p-4">

                <div class="d-flex justify-content-center align-items-center"
                     style="min-height: 300px;">

                    <div class="spinner-border"
                         style="color: var(--primary);"
                         role="status">

                        <span class="visually-hidden">
                            Cargando módulo...
                        </span>

                    </div>

                </div>

            </main>

        </div>

    </div>

    <!-- BIBLIOTECAS EXTERNAS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>

    <script
        src="assets/lib/cytoscape/cytoscape.min.js"
        defer
    ></script>

    <!-- CONFIGURACIÓN Y COMUNICACIÓN CON EL BACKEND -->
    <script src="js/api/endpoints.js" defer></script>
    <script src="js/api/httpClient.js" defer></script>

    <!-- UTILIDADES COMPARTIDAS -->
    <script src="js/utils/dom.js" defer></script>
    <script src="js/utils/formatters.js" defer></script>

    <!-- CONFIGURACIÓN DEL IDIOMA -->
    <script src="js/modules/language.js" defer></script>

    <!-- SISTEMA DE NAVEGACIÓN -->
    <script src="js/utils/router.js" defer></script>

    <!-- AUTENTICACIÓN -->
    <script src="js/modules/auth.js" defer></script>

</body>

</html>
