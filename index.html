<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA SIEM | Centro de Operaciones de Seguridad</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ESTILOS NOVA SIEM -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
</head>

<body>

    <!-- TARJETA DE LOGIN -->
    <div class="login-card">

        <!-- MARCA / LOGO -->
        <div class="text-center mb-4">
            <h2 class="brand-title">NOVA SIEM</h2>
            <p class="text-secondary" style="color: #94A3B8 !important;">
                Exclusivo para Personal Autorizado
            </p>
        </div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="loginForm">

            <!-- USUARIO / CORREO -->
            <div class="mb-3">
                <label for="username" class="form-label text-secondary">Correo / Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
            </div>

            <!-- CONTRASEÑA -->
            <div class="mb-4">
                <label for="password" class="form-label text-secondary">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            </div>

            <!-- ERROR DE AUTENTICACIÓN -->
            <div id="loginAlert" class="alert alert-danger d-none" role="alert" style="background-color: #451a1a; border-color: #EF4444; color: #fca5a5;">
                Credenciales inválidas o acceso no autorizado.
            </div>

            <!-- BOTÓN DE ENTRADA -->
            <button type="submit" class="btn btn-primary w-100">
                Establecer Sesión Segura
            </button>

        </form>

    </div>

    <!-- API Y MÓDULOS -->
    <script src="js/api/endpoints.js"></script>
    <script src="js/api/httpClient.js"></script>
    <script src="js/modules/language.js"></script>
    <script src="js/modules/auth.js"></script>

</body>

</html>
