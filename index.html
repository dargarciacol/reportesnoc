
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA SIEM | Security Operations Center</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- NOVA SIEM STYLES -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">

</head>

<body>

    <!-- LOGIN CONTAINER -->
    <div class="login-card">

        <!-- BRAND -->
        <div class="text-center mb-4">

            <h2 class="brand-title">
                NOVA SIEM
            </h2>

            <p class="text-secondary"
               style="color: #94A3B8 !important;">

                Authorized Personnel Only

            </p>

        </div>


        <!-- LOGIN FORM -->
        <form id="loginForm">

            <!-- USERNAME -->
            <div class="mb-3">

                <label for="username"
                       class="form-label text-secondary">

                    Email

                </label>

                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       required
                       autocomplete="username">

            </div>


            <!-- PASSWORD -->
            <div class="mb-4">

                <label for="password"
                       class="form-label text-secondary">

                    Password

                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       required
                       autocomplete="current-password">

            </div>


            <!-- LOGIN ERROR -->
            <div id="loginAlert"
                 class="alert alert-danger d-none"
                 role="alert"
                 style="background-color: #451a1a;
                        border-color: #EF4444;
                        color: #fca5a5;">

                Invalid credentials or unauthorized access.

            </div>


            <!-- SUBMIT -->
            <button type="submit"
                    class="btn btn-primary w-100">

                Establish Secure Session

            </button>

        </form>

    </div>


    <!-- API -->
    <script src="js/api/endpoints.js"></script>
    <script src="js/api/httpClient.js"></script>


    <!-- LANGUAGE -->
    <script src="js/modules/language.js"></script>


    <!-- AUTHENTICATION -->
    <script src="js/modules/auth.js"></script>

</body>

</html>
