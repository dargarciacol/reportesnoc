<div class="container-fluid p-0 d-flex flex-column" style="height: calc(100vh - 120px);">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="h5 mb-1 text-main fw-bold">
                <span class="badge bg-danger me-2">INC-1002</span>
                Ransomware Execution Sequence Detected
            </h2>
            <div class="text-muted small">
                <i class="bi bi-clock-history me-1"></i> Opened: 2026-11-07T16:05:00Z | 
                <i class="bi bi-person-badge me-1"></i> Lead: s.garcia (SOC L2)
            </div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-info btn-sm fw-bold">
                <i class="bi bi-file-earmark-pdf me-1"></i> Generate Report
            </button>
            <button class="btn btn-primary btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#verdictModal">
                <i class="bi bi-hammer me-1"></i> Submit Verdict
            </button>
        </div>
    </div>

    <div class="row flex-grow-1 g-3 overflow-hidden">
        <div class="col-md-8 d-flex flex-column gap-3 h-100">
            <div class="card bg-surface border-panel rounded-3 d-flex flex-column" style="height: 55%;">
                <div class="card-header bg-transparent border-panel d-flex justify-content-between align-items-center">
                    <span class="text-main fw-semibold"><i class="bi bi-diagram-3 text-primary-nova me-2"></i>Entity Relationship Graph</span>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-outline-secondary py-0" id="btn-layout-cose">Auto</button>
                        <button class="btn btn-sm btn-outline-secondary py-0" id="btn-layout-grid">Grid</button>
                    </div>
                </div>
                <div class="card-body p-0 position-relative flex-grow-1" id="cy-container" style="background-color: #0d1326;">
                </div>
            </div>

            <div class="card bg-surface border-panel rounded-3 d-flex flex-column" style="height: 45%;">
                <div class="card-header bg-transparent border-panel">
                    <span class="text-main fw-semibold"><i class="bi bi-clock text-primary-nova me-2"></i>Chronological Timeline (Facts)</span>
                </div>
                <div class="card-body overflow-auto p-0">
                    <table class="table table-dark table-hover mb-0 align-middle" style="--bs-table-bg: transparent;">
                        <tbody id="timeline-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4 d-flex flex-column h-100">
            <div class="card bg-surface border-panel rounded-3 h-100 d-flex flex-column">
                <div class="card-header bg-transparent border-panel">
                    <span class="text-main fw-semibold"><i class="bi bi-journal-text text-primary-nova me-2"></i>Investigation Notebook</span>
                </div>
                <div class="card-body p-3 overflow-auto d-flex flex-column gap-3">
                    
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold" style="color: #22C55E;"><i class="bi bi-shield-check me-1"></i> FACTS</span>
                            <button class="btn btn-sm btn-outline-success py-0 px-1 border-0" onclick="addNotebookEntry('fact')"><i class="bi bi-plus-lg"></i></button>
                        </div>
                        <ul class="list-group list-group-flush rounded-2 border border-panel" id="list-facts">
                        </ul>
                    </div>

                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold" style="color: #EAB308;"><i class="bi bi-lightbulb me-1"></i> INFERENCES</span>
                            <button class="btn btn-sm btn-outline-warning py-0 px-1 border-0" onclick="addNotebookEntry('inference')"><i class="bi bi-plus-lg"></i></button>
                        </div>
                        <ul class="list-group list-group-flush rounded-2 border border-panel" id="list-inferences">
                        </ul>
                    </div>

                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold" style="color: #94A3B8;"><i class="bi bi-question-circle me-1"></i> PENDING VERIFICATION</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1 border-0" onclick="addNotebookEntry('pending')"><i class="bi bi-plus-lg"></i></button>
                        </div>
                        <ul class="list-group list-group-flush rounded-2 border border-panel" id="list-pending">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="verdictModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-surface border-panel text-main">
            <div class="modal-header border-panel">
                <h5 class="modal-title fw-bold" style="color: var(--primary);">Issue Final Verdict</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="verdictForm">
                    <div class="mb-3">
                        <label class="form-label text-muted">Conclusion</label>
                        <select class="form-select bg-main border-panel text-main" id="verdict-decision" required>
                            <option value="">Select decision...</option>
                            <option value="True Positive - Compromise Confirmed">True Positive - Compromise Confirmed</option>
                            <option value="True Positive - Blocked/Mitigated">True Positive - Blocked/Mitigated</option>
                            <option value="False Positive - Benign Activity">False Positive - Benign Activity</option>
                            <option value="Inconclusive">Inconclusive</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Confidence Level</label>
                        <input type="range" class="form-range" min="1" max="100" id="verdict-confidence">
                        <div class="text-end text-primary-nova fw-bold" id="confidence-val">50%</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Required Action (Authorization Pending)</label>
                        <select class="form-select bg-main border-panel text-main" required>
                            <option value="None">None</option>
                            <option value="Isolate Endpoint">Isolate Endpoint</option>
                            <option value="Revoke User Sessions">Revoke User Sessions</option>
                            <option value="Block External IP">Block External IP</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary fw-bold">Sign & Submit to SecOps Manager</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="js/modules/language.js"></script>
<script src="js/utils/router.js"></script>
