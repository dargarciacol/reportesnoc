
<div class="container-fluid p-0 d-flex flex-column"
     style="height: calc(100vh - 120px);">

    <!-- Investigation Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>
            <h2 class="h5 mb-1 text-main fw-bold">

                <span class="badge bg-danger me-2"
                      id="investigation-incident-id">
                    --
                </span>

                <span id="investigation-incident-title">
                    Loading investigation...
                </span>

            </h2>

            <div class="text-muted small">

                <i class="bi bi-clock-history me-1"></i>

                <span data-i18n="opened">Opened:</span>

                <span id="investigation-opened-at">--</span>

                <span class="mx-2">|</span>

                <i class="bi bi-person-badge me-1"></i>

                <span data-i18n="lead">Lead:</span>

                <span id="investigation-lead">--</span>

            </div>

        </div>

        <div class="d-flex gap-2">

            <button class="btn btn-outline-info btn-sm fw-bold"
                    id="btn-generate-investigation-report"
                    type="button">

                <i class="bi bi-file-earmark-pdf me-1"></i>
                Generate Report

            </button>

            <button class="btn btn-primary btn-sm fw-bold"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#verdictModal">

                <i class="bi bi-hammer me-1"></i>
                Submit Verdict

            </button>

        </div>

    </div>

    <!-- Investigation Content -->
    <div class="row flex-grow-1 g-3 overflow-hidden">

        <!-- Graph and Timeline -->
        <div class="col-md-8 d-flex flex-column gap-3 h-100">

            <!-- Entity Relationship Graph -->
            <div class="card bg-surface border-panel rounded-3 d-flex flex-column"
                 style="height: 55%;">

                <div class="card-header bg-transparent border-panel
                            d-flex justify-content-between align-items-center">

                    <span class="text-main fw-semibold">

                        <i class="bi bi-diagram-3 text-primary-nova me-2"></i>
                        Entity Relationship Graph

                    </span>

                    <div class="btn-group">

                        <button class="btn btn-sm btn-outline-secondary py-0"
                                id="btn-layout-cose"
                                type="button">
                            Auto
                        </button>

                        <button class="btn btn-sm btn-outline-secondary py-0"
                                id="btn-layout-grid"
                                type="button">
                            Grid
                        </button>

                    </div>

                </div>

                <div class="card-body p-0 position-relative flex-grow-1"
                     id="cy-container"
                     style="background-color: #0d1326;">

                    <div id="investigation-graph-loading"
                         class="position-absolute top-50 start-50 translate-middle
                                text-muted small">

                        <div class="spinner-border spinner-border-sm me-2"
                             role="status">
                        </div>

                        Loading entity graph...

                    </div>

                </div>

            </div>

            <!-- Chronological Timeline -->
            <div class="card bg-surface border-panel rounded-3 d-flex flex-column"
                 style="height: 45%;">

                <div class="card-header bg-transparent border-panel">

                    <span class="text-main fw-semibold">

                        <i class="bi bi-clock text-primary-nova me-2"></i>
                        Chronological Timeline (Facts)

                    </span>

                </div>

                <div class="card-body overflow-auto p-0">

                    <table class="table table-dark table-hover mb-0 align-middle"
                           style="--bs-table-bg: transparent;">

                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Event</th>
                                <th>Source</th>
                                <th>Severity</th>
                            </tr>
                        </thead>

                        <tbody id="timeline-body">

                            <tr>
                                <td colspan="4"
                                    class="text-center text-muted py-4">

                                    Loading investigation timeline...

                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Investigation Notebook -->
        <div class="col-md-4 d-flex flex-column h-100">

            <div class="card bg-surface border-panel rounded-3 h-100
                        d-flex flex-column">

                <div class="card-header bg-transparent border-panel">

                    <span class="text-main fw-semibold">

                        <i class="bi bi-journal-text text-primary-nova me-2"></i>
                        Investigation Notebook

                    </span>

                </div>

                <div class="card-body p-3 overflow-auto
                            d-flex flex-column gap-3">

                    <!-- Facts -->
                    <div>

                        <div class="d-flex justify-content-between
                                    align-items-center mb-2">

                            <span class="fw-bold" style="color: #22C55E;">

                                <i class="bi bi-shield-check me-1"></i>
                                FACTS

                            </span>

                            <button class="btn btn-sm btn-outline-success
                                           py-0 px-1 border-0"
                                    type="button"
                                    id="btn-add-fact"
                                    onclick="addNotebookEntry('fact')"
                                    aria-label="Add fact">

                                <i class="bi bi-plus-lg"></i>

                            </button>

                        </div>

                        <ul class="list-group list-group-flush rounded-2
                                   border border-panel"
                            id="list-facts">
                        </ul>

                    </div>

                    <!-- Inferences -->
                    <div>

                        <div class="d-flex justify-content-between
                                    align-items-center mb-2">

                            <span class="fw-bold" style="color: #EAB308;">

                                <i class="bi bi-lightbulb me-1"></i>
                                INFERENCES

                            </span>

                            <button class="btn btn-sm btn-outline-warning
                                           py-0 px-1 border-0"
                                    type="button"
                                    id="btn-add-inference"
                                    onclick="addNotebookEntry('inference')"
                                    aria-label="Add inference">

                                <i class="bi bi-plus-lg"></i>

                            </button>

                        </div>

                        <ul class="list-group list-group-flush rounded-2
                                   border border-panel"
                            id="list-inferences">
                        </ul>

                    </div>

                    <!-- Pending Verification -->
                    <div>

                        <div class="d-flex justify-content-between
                                    align-items-center mb-2">

                            <span class="fw-bold" style="color: #94A3B8;">

                                <i class="bi bi-question-circle me-1"></i>
                                PENDING VERIFICATION

                            </span>

                            <button class="btn btn-sm btn-outline-secondary
                                           py-0 px-1 border-0"
                                    type="button"
                                    id="btn-add-pending"
                                    onclick="addNotebookEntry('pending')"
                                    aria-label="Add pending verification">

                                <i class="bi bi-plus-lg"></i>

                            </button>

                        </div>

                        <ul class="list-group list-group-flush rounded-2
                                   border border-panel"
                            id="list-pending">
                        </ul>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Verdict Modal -->
<div class="modal fade"
     id="verdictModal"
     tabindex="-1"
     aria-labelledby="verdictModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content bg-surface border-panel text-main">

            <div class="modal-header border-panel">

                <h5 class="modal-title fw-bold"
                    id="verdictModalLabel"
                    style="color: var(--primary);">

                    Issue Final Verdict

                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>

            </div>

            <div class="modal-body">

                <form id="verdictForm">

                    <!-- Decision -->
                    <div class="mb-3">

                        <label class="form-label text-muted"
                               for="verdict-decision">

                            Conclusion

                        </label>

                        <select class="form-select bg-main border-panel text-main"
                                id="verdict-decision"
                                name="verdict"
                                required>

                            <option value="">
                                Select decision...
                            </option>

                            <option value="TRUE_POSITIVE_CONFIRMED">
                                True Positive - Compromise Confirmed
                            </option>

                            <option value="TRUE_POSITIVE_MITIGATED">
                                True Positive - Blocked/Mitigated
                            </option>

                            <option value="FALSE_POSITIVE">
                                False Positive - Benign Activity
                            </option>

                            <option value="INCONCLUSIVE">
                                Inconclusive
                            </option>

                        </select>

                    </div>

                    <!-- Confidence -->
                    <div class="mb-3">

                        <label class="form-label text-muted"
                               for="verdict-confidence">

                            Confidence Level

                        </label>

                        <input type="range"
                               class="form-range"
                               min="1"
                               max="100"
                               value="50"
                               id="verdict-confidence"
                               name="confidenceScore">

                        <div class="text-end text-primary-nova fw-bold"
                             id="confidence-val">

                            50%

                        </div>

                    </div>

                    <!-- Recommended Action -->
                    <div class="mb-3">

                        <label class="form-label text-muted"
                               for="verdict-required-action">

                            Recommended Action

                        </label>

                        <select class="form-select bg-main border-panel text-main"
                                id="verdict-required-action"
                                name="recommendedAction"
                                required>

                            <option value="None">
                                None
                            </option>

                            <option value="Isolate Endpoint">
                                Isolate Endpoint
                            </option>

                            <option value="Revoke User Sessions">
                                Revoke User Sessions
                            </option>

                            <option value="Block External IP">
                                Block External IP
                            </option>

                        </select>

                    </div>

                    <!-- Status -->
                    <div id="verdictStatus"
                         class="alert d-none mt-3"
                         role="alert">
                    </div>

                    <!-- Submit -->
                    <div class="d-grid gap-2 mt-4">

                        <button type="submit"
                                class="btn btn-primary fw-bold"
                                id="btn-submit-verdict">

                            <i class="bi bi-check-circle me-1"></i>
                            Sign & Submit to SecOps Manager

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Scripts -->
<script src="js/modules/language.js"></script>
<script src="js/utils/router.js"></script>
