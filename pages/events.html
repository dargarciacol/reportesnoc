<div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0" style="color: var(--text-main);">Event Management</h2>
        <button class="btn btn-primary btn-sm fw-bold" id="btn-upload-modal" data-bs-toggle="modal" data-bs-target="#uploadModal">
            <i class="bi bi-file-earmark-excel me-1"></i> Ingest Telemetry
        </button>
    </div>

    <div class="card bg-surface border-panel mb-4 rounded-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control bg-main border-panel text-main" placeholder="Search events..." id="filter-search">
                </div>
                <div class="col-md-2">
                    <select class="form-select bg-main border-panel text-main" id="filter-severity">
                        <option value="">All Severities</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="datetime-local" class="form-control bg-main border-panel text-main" id="filter-date">
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-outline-info btn-sm me-2" id="btn-refresh"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                    <button class="btn btn-outline-secondary btn-sm" id="btn-export"><i class="bi bi-download"></i> Export</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card bg-surface border-panel h-100 rounded-3">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0 align-middle" style="--bs-table-bg: var(--bg-surface);">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Source IP</th>
                        <th>User / Identity</th>
                        <th>Event Type</th>
                        <th>Action / Outcome</th>
                        <th>Severity</th>
                        <th class="text-center">Details</th>
                    </tr>
                </thead>
                <tbody id="table-events-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-surface border-panel text-main">
            <div class="modal-header border-panel">
                <h5 class="modal-title fw-bold" style="color: var(--primary);">Ingest Telemetry (Excel/CSV)</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label" style="color: var(--text-muted);">Select file containing raw events</label>
                        <input class="form-control bg-main border-panel text-main" type="file" id="fileInput" accept=".csv, .xlsx, .xls" required>
                    </div>
                    <div id="uploadStatus" class="alert d-none mt-3" role="alert"></div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary fw-bold" id="btn-submit-upload">Process & Normalise</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
