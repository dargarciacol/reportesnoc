
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="NOVA SIEM - Gestión y respuesta ante incidentes de seguridad">

    <meta name="theme-color" content="#0B1120">

    <title>NOVA SIEM | Gestión de incidentes</title>

    <!-- BOOTSTRAP CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ICONOS BOOTSTRAP -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- ESTILOS NOVA SIEM -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">

</head>

<body>

    <div class="container-fluid p-0">

        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="h4 mb-0 text-main">
                Gestión de incidentes
            </h2>

            <button
                class="btn btn-danger btn-sm fw-bold"
                type="button"
                data-bs-toggle="modal"
                data-bs-target="#createIncidentModal"
            >

                <i class="bi bi-shield-exclamation me-1"></i>
                Declarar incidente crítico

            </button>

        </div>

        <!-- FILTROS Y BÚSQUEDA -->
        <div class="card bg-surface border-panel mb-4 rounded-3">

            <div class="card-body">

                <div class="row g-3">

                    <!-- BÚSQUEDA -->
                    <div class="col-md-4">

                        <input
                            type="text"
                            class="form-control bg-main border-panel text-main"
                            placeholder="Buscar por identificador o título..."
                            id="search-incidents"
                            aria-label="Buscar incidentes por identificador o título"
                        >

                    </div>

                    <!-- FILTRO DE SEVERIDAD -->
                    <div class="col-md-2">

                        <select
                            class="form-select bg-main border-panel text-main"
                            id="filter-severity-inc"
                            aria-label="Filtrar incidentes por severidad"
                        >

                            <option value="">Severidad</option>
                            <option value="Critical">Crítica</option>
                            <option value="High">Alta</option>
                            <option value="Medium">Media</option>
                            <option value="Low">Baja</option>

                        </select>

                    </div>

                    <!-- FILTRO DE ESTADO -->
                    <div class="col-md-3">

                        <select
                            class="form-select bg-main border-panel text-main"
                            id="filter-status-inc"
                            aria-label="Filtrar incidentes por estado"
                        >

                            <option value="">Todos los estados</option>
                            <option value="Triage">Evaluación inicial</option>
                            <option value="Containment">Contención</option>
                            <option value="Eradication">Erradicación</option>
                            <option value="Recovery">Recuperación</option>
                            <option value="Closed">Cerrado</option>

                        </select>

                    </div>

                    <!-- MIS INCIDENTES -->
                    <div class="col-md-3 text-end">

                        <button
                            class="btn btn-outline-info btn-sm w-100 fw-bold"
                            id="btn-my-incidents"
                            type="button"
                        >

                            <i class="bi bi-person-bounding-box me-1"></i>
                            Mis casos activos

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- CONTENEDOR DE INCIDENTES -->
        <div class="row" id="incidents-container">

            <!-- Las tarjetas de incidentes se generan mediante incidents.js -->

        </div>

    </div>


    <!-- MODAL DE CREACIÓN DE INCIDENTES -->
    <div
        class="modal fade"
        id="createIncidentModal"
        tabindex="-1"
        aria-labelledby="createIncidentModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered modal-lg">

            <div class="modal-content bg-surface border-panel text-main">

                <!-- ENCABEZADO DEL MODAL -->
                <div class="modal-header border-panel">

                    <h5
                        class="modal-title fw-bold text-danger"
                        id="createIncidentModalLabel"
                    >

                        Declarar incidente manualmente

                    </h5>

                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    >
                    </button>

                </div>

                <!-- CUERPO DEL MODAL -->
                <div class="modal-body">

                    <form id="createIncidentForm">

                        <!-- TÍTULO DEL INCIDENTE -->
                        <div class="mb-3">

                            <label
                                for="incidentTitle"
                                class="form-label text-muted"
                            >
                                Título del incidente
                            </label>

                            <input
                                type="text"
                                id="incidentTitle"
                                class="form-control bg-main border-panel text-main"
                                required
                                maxlength="255"
                                placeholder="Ej.: Posible ataque de ransomware en la red de Marketing"
                            >

                        </div>

                        <!-- SEVERIDAD E HIPÓTESIS -->
                        <div class="row mb-3">

                            <!-- SEVERIDAD -->
                            <div class="col-md-6">

                                <label
                                    for="incidentSeverity"
                                    class="form-label text-muted"
                                >
                                    Severidad inicial
                                </label>

                                <select
                                    id="incidentSeverity"
                                    class="form-select bg-main border-panel text-main text-danger fw-bold"
                                    required
                                >

                                    <option value="Critical">Crítica</option>
                                    <option value="High" selected>Alta</option>
                                    <option value="Medium">Media</option>
                                    <option value="Low">Baja</option>

                                </select>

                            </div>

                            <!-- HIPÓTESIS PRINCIPAL -->
                            <div class="col-md-6">

                                <label
                                    for="incidentHypothesis"
                                    class="form-label text-muted"
                                >
                                    Hipótesis principal
                                </label>

                                <select
                                    id="incidentHypothesis"
                                    class="form-select bg-main border-panel text-main"
                                    required
                                >

                                    <option value="Malware Execution">
                                        Ejecución de software malicioso
                                    </option>

                                    <option value="Compromised Credentials">
                                        Credenciales comprometidas
                                    </option>

                                    <option value="Insider Threat">
                                        Amenaza interna
                                    </option>

                                    <option value="Data Exfiltration">
                                        Exfiltración de datos
                                    </option>

                                    <option value="Phishing Campaign">
                                        Campaña de suplantación de identidad
                                    </option>

                                </select>

                            </div>

                        </div>

                        <!-- ALCANCE Y ACTIVOS AFECTADOS -->
                        <div class="mb-3">

                            <label
                                for="incidentDescription"
                                class="form-label text-muted"
                            >
                                Alcance inicial y activos afectados
                            </label>

                            <textarea
                                id="incidentDescription"
                                class="form-control bg-main border-panel text-main"
                                rows="3"
                                placeholder="Indique las direcciones IP, usuarios o sistemas afectados..."
                            ></textarea>

                        </div>

                        <!-- BOTONES DE ACCIÓN -->
                        <div class="d-flex justify-content-end gap-2 mt-4">

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                data-bs-dismiss="modal"
                            >

                                Cancelar

                            </button>

                            <button
                                type="submit"
                                class="btn btn-danger fw-bold"
                            >

                                <i class="bi bi-shield-check me-1"></i>
                                Crear incidente y asignármelo

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- NOTA:
         Las bibliotecas compartidas, el router y los módulos
         se administran desde app.html. -->

</body>

</html>
