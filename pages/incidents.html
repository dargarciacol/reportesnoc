
<div class="container-fluid p-0">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0 text-main">Incident Management</h2>

        <button class="btn btn-danger btn-sm fw-bold"
                data-bs-toggle="modal"
                data-bs-target="#createIncidentModal">
            <i class="bi bi-shield-exclamation me-1"></i>
            Declare Major Incident
        </button>
    </div>

    <div class="card bg-surface border-panel mb-4 rounded-3">
        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-4">
                    <input
                        type="text"
                        class="form-control bg-main border-panel text-main"
                        placeholder="Search by INC-ID or title..."
                        id="search-incidents"
                    >
                </div>

                <div class="col-md-2">
                    <select
                        class="form-select bg-main border-panel text-main"
                        id="filter-severity-inc">
                        <option value="">Severity</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <select
                        class="form-select bg-main border-panel text-main"
                        id="filter-status-inc">
                        <option value="">Status</option>
                        <option value="Triage">Triage</option>
                        <option value="Containment">Containment</option>
                        <option value="Eradication">Eradication</option>
                        <option value="Recovery">Recovery</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>

                <div class="col-md-3 text-end">
                    <button
                        class="btn btn-outline-info btn-sm w-100 fw-bold"
                        id="btn-my-incidents"
                        type="button">
                        <i class="bi bi-person-bounding-box me-1"></i>
                        My Active Cases
                    </button>
                </div>

            </div>
        </div>
    </div>

    <div class="row" id="incidents-container">
        <!-- Incident cards are rendered by incidents.js -->
    </div>
</div>

<!-- CREATE INCIDENT MODAL -->
<div class="modal fade"
     id="createIncidentModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-surface border-panel text-main">

            <div class="modal-header border-panel">
                <h5 class="modal-title fw-bold text-danger">
                    Declare Incident manually
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>
            </div>

            <div class="modal-body">

                <form id="createIncidentForm">

                    <div class="mb-3">
                        <label for="incidentTitle" class="form-label text-muted">
                            Incident Title
                        </label>

                        <input
                            type="text"
                            id="incidentTitle"
                            class="form-control bg-main border-panel text-main"
                            required
                            maxlength="255"
                            placeholder="e.g., Possible Ransomware outbreak on Marketing Subnet">
                    </div>

                    <div class="row mb-3">

                        <div class="col-md-6">
                            <label for="incidentSeverity"
                                   class="form-label text-muted">
                                Initial Severity
                            </label>

                            <select
                                id="incidentSeverity"
                                class="form-select bg-main border-panel text-main text-danger fw-bold"
                                required>

                                <option value="Critical">Critical</option>
                                <option value="High" selected>High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="incidentHypothesis"
                                   class="form-label text-muted">
                                Primary Hypothesis
                            </label>

                            <select
                                id="incidentHypothesis"
                                class="form-select bg-main border-panel text-main"
                                required>

                                <option value="Malware Execution">
                                    Malware Execution
                                </option>

                                <option value="Compromised Credentials">
                                    Compromised Credentials
                                </option>

                                <option value="Insider Threat">
                                    Insider Threat
                                </option>

                                <option value="Data Exfiltration">
                                    Data Exfiltration
                                </option>

                                <option value="Phishing Campaign">
                                    Phishing Campaign
                                </option>
                            </select>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label for="incidentDescription"
                               class="form-label text-muted">
                            Initial Scope / Affected Assets
                        </label>

                        <textarea
                            id="incidentDescription"
                            class="form-control bg-main border-panel text-main"
                            rows="3"
                            placeholder="List known IPs, users, or systems...">
                        </textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="btn btn-danger fw-bold">
                            Open Case & Assign to Me
                        </button>

                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="js/modules/language.js"></script>
<script src="js/utils/router.js"></script>
